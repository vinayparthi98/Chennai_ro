{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p>
            Register to order RO products online.
        </p>

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Full name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <label>Phone</label>

            <input
                type="text"
                name="phone"
                placeholder="Phone number"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <button class="btn primary full">
                Create Account
            </button>

        </form>

    </div>

</div>

{% endblock %}
